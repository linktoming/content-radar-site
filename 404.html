<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Off the radar · AI Radar</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* Tokens mirror the landing page. Absolute link paths throughout: GitHub Pages
   serves this file for a miss at ANY depth, including /reports/*. */
:root{--ground:#ECEDEF;--ink:#141821;--muted:#5C6470;--faint:#8A909A;--line:#D7DADF;
  --east:#C67A16;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Songti SC","Noto Serif CJK SC",Georgia,serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--ground:#0B0E13;--ink:#DCE3EC;--muted:#8A94A2;--faint:#5E6875;--line:#252F3C;--east:#E0912E}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--ground);color:var(--ink);padding:32px;
  font-family:system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.box{max-width:44ch;text-align:center}
.code{font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--east)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,6vw,42px);margin:16px 0 0;letter-spacing:-.01em}
p{color:var(--muted);margin:14px 0 0}
p.zh{font-size:15px}
.row{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{font-family:var(--mono);font-size:13px;letter-spacing:.04em;padding:11px 18px;border-radius:3px;
  text-decoration:none;border:1px solid var(--line);color:var(--ink);transition:border-color .2s}
a:hover{border-color:var(--east)}
a.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.sig{margin-top:34px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--faint)}
</style>
<div class="box">
  <div class="code">404 · no return signal</div>
  <h1>Off the radar</h1>
  <p>This page isn't in the sweep. It may have moved, or never existed.</p>
  <p class="zh">这个页面不在扫描范围内 —— 可能已经移动,或者从来没有过。</p>
  <div class="row">
    <a class="primary" href="/">Today's radar →</a>
    <a href="/#archive">Archive · 往期</a>
  </div>
  <div class="sig">radar.sharpener.ai</div>
</div>
