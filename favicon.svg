<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The brand mark: a radar scope. Amber = east/dawn (--east), the same token the
       header dot and section numbers use. Ring strokes stay visible at 16px. -->
  <circle cx="16" cy="16" r="14.5" fill="#141821"/>
  <g fill="none" stroke="#C67A16" stroke-opacity=".45" stroke-width="1.2">
    <circle cx="16" cy="16" r="10.5"/>
    <circle cx="16" cy="16" r="6"/>
  </g>
  <path d="M16 16 L16 4.5 A11.5 11.5 0 0 1 26 10.5 Z" fill="#C67A16" fill-opacity=".38"/>
  <path d="M16 16 L16 4.5" stroke="#E0912E" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="2.4" fill="#E0912E"/>
</svg>
