<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>AI Radar</title>
  <!-- Brand mark: a radar scope. Three high-contrast shapes only, because the
       common size is 16px; thin rings on a dark disc vanish in the tab strip.
       Amber (#E0912E, the east/dawn brand token) carries it, and reads on both
       light and dark browser chrome.
       NOTE: never write a double hyphen inside this comment. It is illegal in an
       XML comment and silently makes the whole file unparseable, which is exactly
       why the first favicon never rendered anywhere (2026-08-05). -->
  <rect width="32" height="32" rx="7" fill="#141821"/>
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#E0912E" stroke-width="2.6" stroke-opacity=".55"/>
  <path d="M16 16 L16 4 A12 12 0 0 1 26.4 10 Z" fill="#E0912E" fill-opacity=".9"/>
  <circle cx="16" cy="16" r="4" fill="#E0912E"/>
</svg>
